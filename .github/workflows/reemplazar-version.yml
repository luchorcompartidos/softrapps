name: Reemplazar versión

# Se lanza a mano: pestaña Actions > "Reemplazar versión" > Run workflow.
# Borra el Release y el tag indicados (si existen) y los vuelve a crear
# apuntando al último commit de la rama elegida, con los archivos adjuntos.
# Sirve también para crear una versión nueva con un número a elección.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a reemplazar o crear (ej. v0.3.0)"
        required: true
        type: string
      confirmar:
        description: "Escribí de nuevo la versión para confirmar (borra la existente y no se puede deshacer)"
        required: true
        type: string
      rama:
        description: "Rama a la que apunta la versión nueva"
        required: true
        default: main
        type: string
      adjuntos:
        description: "Archivos del repo a adjuntar, separados por espacio (vacío = ninguno)"
        required: false
        default: "index.html"
        type: string
      incluir_planilla:
        description: "Adjuntar la planilla publicada (versión actual descargada de Google)"
        required: false
        default: false
        type: boolean
      notas:
        description: "Notas del Release (vacío = mensaje del último commit)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  # Planilla publicada en la web como .xlsx (Todo el documento).
  PLANILLA_URL: ""
  PLANILLA_NOMBRE: "planilla.xlsx"
  DISPARAR_FLUJO: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  reemplazar:
    runs-on: ubuntu-latest
    steps:
      - name: Validar datos
        env:
          V: ${{ inputs.version }}
          C: ${{ inputs.confirmar }}
        run: |
          if [ "$V" != "$C" ]; then
            echo "::error::La confirmación ('$C') no coincide con la versión ('$V'). No se hizo nada."
            exit 1
          fi
          if ! grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' <<< "$V"; then
            echo "::error::Formato de versión inválido: '$V'. Usá vX.Y.Z (ej. v0.3.0); se aceptan también las viejas vX.Y."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
          fetch-depth: 0

      - name: Verificar adjuntos
        env:
          ADJ: ${{ inputs.adjuntos }}
          RAMA: ${{ inputs.rama }}
        run: |
          for f in $ADJ; do
            [ -f "$f" ] || { echo "::error::No existe el archivo '$f' en la rama $RAMA."; exit 1; }
          done

      - name: Descargar planilla
        if: ${{ inputs.incluir_planilla }}
        run: |
          curl -fsSL "$PLANILLA_URL" -o "$PLANILLA_NOMBRE" || { echo "::error::No se pudo descargar la planilla. Revisá que siga publicada como .xlsx."; exit 1; }
          head -c 2 "$PLANILLA_NOMBRE" | grep -q PK || { echo "::error::Lo descargado no es un .xlsx. Revisá la publicación (Todo el documento, formato .xlsx)."; exit 1; }

      - name: Borrar Release y tag existentes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            gh release delete "$V" --yes
            echo "Release $V borrado."
          else
            echo "No había Release $V."
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            git push origin ":refs/tags/$V"
            echo "Tag $V borrado."
          else
            echo "No había tag $V."
          fi
          git tag -d "$V" 2>/dev/null || true

      - name: Crear tag y Release nuevos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
          ADJ: ${{ inputs.adjuntos }}
          NOTAS: ${{ inputs.notas }}
          PLAN: ${{ inputs.incluir_planilla }}
        run: |
          [ "$PLAN" = "true" ] && ADJ="$ADJ $PLANILLA_NOMBRE"
          sha=$(git rev-parse HEAD)
          [ -n "$NOTAS" ] || NOTAS="$(git log -1 --pretty=%s) (commit ${sha::7})"
          git tag "$V" "$sha"
          git push origin "$V"
          gh release create "$V" --title "$V" --notes "$NOTAS" --verify-tag $ADJ
          echo "Listo: $V apunta a ${sha::7}."
          if [ -n "$DISPARAR_FLUJO" ]; then gh workflow run "$DISPARAR_FLUJO" --ref "${{ inputs.rama }}"; fi
